spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/washhub_dev?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# AWS S3
cloud:
  aws:
    s3:
      bucket: washhub-dev
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    stack:
      auto: false

# 로깅 (dev)
logging:
  level:
    com.washhub.api: DEBUG
    org.hibernate.SQL: DEBUG
